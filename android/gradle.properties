# 本机物理内存仅 8GB（2026-10-09 实测定位）：若把 Gradle 堆上限给到 4G，会挤爆
# 物理内存、迫使内核大量换页到 swap，实测构建从 2 分 23 秒劣化到 10 分 8 秒
# （同一个 daemon、同一台机器、改动量更小）。压到 2G 并单独限制 Kotlin 守护进程，
# 是"够用且不触发换页"的平衡点；日后若加内存到 16G，可酌情调回 3~4G。
# 若出现 OutOfMemoryError，先把下面的 2G 调到 3G。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
# Kotlin 编译守护进程独立限内存（默认会再占 1~2G，是小内存机器的隐形大户）
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# Jetifier 会对所有依赖做字节码重写，是 release 构建的固定开销。
# 本项目依赖已全部为 AndroidX，无需 Jetifier（若引入旧 support 库导致构建失败，
# 把下面这行改回 true 即可）。
android.enableJetifier=false
# 复用 Gradle 构建缓存与并行任务，缩短重复构建时间
org.gradle.caching=true
org.gradle.parallel=true
